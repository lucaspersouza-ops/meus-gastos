<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>Meus Gastos</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f6f8;color:#17181b}
main{max-width:560px;margin:auto;padding:18px 16px 40px}
h1{font-size:28px;margin:6px 0 18px}.card{background:#fff;border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 2px 12px #0000000b}
label{display:block;font-size:13px;font-weight:600;margin:10px 0 6px;color:#555}
input,select,button{width:100%;height:48px;border:1px solid #ddd;border-radius:12px;font-size:16px;padding:0 13px;background:#fff}
button{border:0;background:#111827;color:white;font-weight:700;margin-top:14px}
button.secondary{background:#eef0f3;color:#222}.row{display:grid;grid-template-columns:minmax(0,1fr) 128px;gap:8px}.row>div{min-width:0;overflow:hidden}.row input{min-width:0;width:100%;max-width:100%;padding-left:9px;padding-right:9px}input[type="date"],input[type="month"]{min-width:0;max-width:100%;width:100%;font-size:15px}
.total{font-size:26px;font-weight:800;margin-top:4px}.muted{color:#73777f;font-size:13px}
.item{display:flex;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid #eee}
.item:last-child{border-bottom:0}.desc{font-weight:600}.meta{font-size:12px;color:#777;margin-top:4px}
.price{font-weight:700;white-space:nowrap}.actions button{width:auto;height:32px;padding:0 9px;margin:5px 0 0 5px;font-size:12px}
.empty{text-align:center;padding:20px;color:#888}.pill{display:inline-block;background:#f0f1f3;border-radius:20px;padding:4px 8px;font-size:11px;margin-top:5px}
.top{display:flex;justify-content:space-between;align-items:end;gap:10px}.top>*{min-width:0}.top .muted{white-space:normal;text-align:right}.summary-row{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid #eee}.summary-row span{min-width:0;overflow-wrap:anywhere}.summary-row strong{white-space:nowrap;font-size:15px}
@media(max-width:380px){main{padding-left:12px;padding-right:12px}.card{padding:14px}.row{grid-template-columns:minmax(0,1fr) 118px;gap:7px}.row input{font-size:14px;padding:0 7px}.total{font-size:24px}input[type="month"]{font-size:15px}}\n</style>
</head>
<body>
<main>
  <div class="top"><h1>Meus Gastos</h1><span class="muted" id="count"></span></div>

  <section class="card">
    <label>O que foi o gasto?</label>
    <input id="desc" placeholder="Ex.: almoço de trabalho">

    <div class="row">
      <div>
        <label>Valor</label>
        <input id="valor" inputmode="numeric" autocomplete="off" placeholder="R$ 0,00" aria-label="Valor">
      </div>
      <div>
        <label>Data</label>
        <input id="data" type="date">
      </div>
    </div>

    <label>Categoria <span class="muted">(opcional)</span></label>
    <select id="cat">
      <option value="">Ainda não categorizar</option>
      <option>Mercado</option><option>Gasolina</option><option>Cotidiano</option>
      <option>Carro</option><option>Miguel</option><option>Casa</option>
      <option>Saúde</option><option>Lazer</option><option>Compras</option><option>Outros</option>
    </select>

    <button onclick="add()">Adicionar gasto</button>
  </section>

  <section class="card">
    <label>Mês</label>
    <input id="mes" type="month" onchange="render()">
    <div class="muted">Total registrado no mês</div>
    <div class="total" id="total">R$ 0,00</div>
  </section>

  <section class="card">
    <div class="top"><strong>Gastos</strong><span class="muted">Você pode categorizar depois</span></div>
    <div id="lista"></div>
  </section>

  <section class="card">
    <strong>Resumo por categoria</strong>
    <div id="resumo" style="margin-top:10px"></div>
    <button class="secondary" onclick="exportar()">Exportar CSV</button>
  </section>
</main>

<script>
const KEY="meus_gastos_v1";
let gastos=JSON.parse(localStorage.getItem(KEY)||"[]");
const brl=new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"});
function mascaraValor(el){
  const digits=(el.value||"").replace(/\D/g,"");
  if(!digits){el.value="";return}
  const n=digits.padStart(3,"0");
  let inteiro=n.slice(0,-2).replace(/^0+(?=\d)/,"");
  inteiro=inteiro.replace(/\B(?=(\d{3})+(?!\d))/g,".");
  el.value=inteiro+","+n.slice(-2);
}
document.getElementById("valor").addEventListener("input",function(){mascaraValor(this)});
function hoje(){let d=new Date();return d.toISOString().slice(0,10)}
document.getElementById("data").value=hoje();
document.getElementById("mes").value=hoje().slice(0,7);

function parseValor(s){
  s=(s||"").replace(/\s/g,"").replace(/R\$/i,"");
  if(s.includes(",")) s=s.replace(/\./g,"").replace(",",".");
  return Number(s);
}
function save(){localStorage.setItem(KEY,JSON.stringify(gastos))}
function add(){
  const desc=document.getElementById("desc").value.trim();
  const valor=parseValor(document.getElementById("valor").value);
  const data=document.getElementById("data").value;
  const cat=document.getElementById("cat").value;
  if(!desc){alert("Digite o que foi o gasto.");return}
  if(!valor || valor<=0){alert("Digite um valor válido.");return}
  gastos.push({id:Date.now(),desc,valor,data,cat});
  save();
  document.getElementById("desc").value="";
  document.getElementById("valor").value="";
  document.getElementById("cat").value="";
  render();
}
function excluir(id){
  if(confirm("Excluir este gasto?")){gastos=gastos.filter(x=>x.id!==id);save();render()}
}
function categorizar(id){
  const x=gastos.find(g=>g.id===id);
  const c=prompt("Digite a categoria para este gasto:",x.cat||"");
  if(c!==null){x.cat=c.trim();save();render()}
}
function render(){
  const mes=document.getElementById("mes").value;
  const arr=gastos.filter(x=>x.data.slice(0,7)===mes).sort((a,b)=>b.data.localeCompare(a.data)||b.id-a.id);
  const total=arr.reduce((s,x)=>s+x.valor,0);
  document.getElementById("total").textContent=brl.format(total);
  document.getElementById("count").textContent=arr.length+" gasto"+(arr.length===1?"":"s");
  const lista=document.getElementById("lista");
  lista.innerHTML=arr.length?arr.map(x=>`
    <div class="item">
      <div>
        <div class="desc">${esc(x.desc)}</div>
        <div class="meta">${new Date(x.data+"T12:00:00").toLocaleDateString("pt-BR")}</div>
        <span class="pill">${esc(x.cat||"Sem categoria")}</span>
      </div>
      <div style="text-align:right">
        <div class="price">${brl.format(x.valor)}</div>
        <div class="actions"><button onclick="categorizar(${x.id})">categorizar</button><button onclick="excluir(${x.id})">excluir</button></div>
      </div>
    </div>`).join(""):'<div class="empty">Nenhum gasto registrado neste mês.</div>';
  const map={};
  arr.forEach(x=>{let c=x.cat||"Sem categoria";map[c]=(map[c]||0)+x.valor});
  const rs=Object.entries(map).sort((a,b)=>b[1]-a[1]);
  document.getElementById("resumo").innerHTML=rs.length?rs.map(([c,v])=>`<div class="summary-row"><span>${esc(c)}</span><strong>${brl.format(v)}</strong></div>`).join(""):'<div class="empty">O resumo aparecerá quando você registrar gastos.</div>';
}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function exportar(){
  const rows=[["Data","Descrição","Valor","Categoria"],...gastos.map(x=>[x.data,x.desc,x.valor.toFixed(2).replace(".",","),x.cat||""])];
  const csv="\ufeff"+rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(";")).join("\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));a.download="meus-gastos.csv";a.click();URL.revokeObjectURL(a.href);
}
render();
</script>
</body>
</html>
